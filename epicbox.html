<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Epicbox — Epic Entertainment HUB</title>
<meta name="description" content="Epicbox — build 3D games and play what others made. Part of Epic Entertainment HUB.">
<meta name="theme-color" content="#000080">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="stylesheet" href="css/epicbox.css">
</head>
<body>

<canvas id="stage"></canvas>

<!-- Top toolbar -->
<header id="bar">
  <a id="home" href="index.html" title="Back to the HUB">&larr; HUB</a>
  <span id="brand">EPIC<span>BOX</span></span>
  <span class="bar-sp"></span>
  <button id="btn-play" type="button" class="go">▶ Playtest</button>
  <button id="btn-edit" type="button">✎ Edit</button>
  <button id="btn-clear" type="button">Clear</button>
  <button id="btn-publish" type="button" title="Coming soon" disabled>Publish</button>
</header>

<!-- Asset palette (edit mode) -->
<aside id="tools">
  <div id="palette"></div>
  <p class="tip">Click to place a part, then drag its coloured orbs to stretch it. Click a part to select · drag empty space to orbit · scroll to zoom · right-drag to pan</p>
</aside>

<!-- Play HUD -->
<div id="hud" aria-hidden="true">
  <span id="hud-coins">Coins: 0</span>
  <span class="hud-keys">WASD move · Space jump · Shift run · drag to look</span>
</div>

<script type="module" src="js/epicbox.js"></script>
</body>
</html>

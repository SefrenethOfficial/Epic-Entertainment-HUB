<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>epic clicker ▓ hidden node</title>
  <link rel="stylesheet" href="css/clicker.css">
</head>
<body>
  <div id="scanlines"></div>
  <header class="bar">
    <span class="dot"></span>
    <span class="url">ee5j7xq3vh2k9wqp4nbz6d.onion / epic_clicker</span>
    <a class="exit" href="index.html">[ exit node ]</a>
  </header>

  <main>
    <section class="stage">
      <h1 class="glitch" data-text="EPIC CLICKER">EPIC CLICKER</h1>
      <p class="sub">you found the hidden node. click the face. harvest Epic Points.</p>

      <div class="counters">
        <div class="points"><span id="points">0</span> <em>EP</em></div>
        <div class="rate"><span id="rate">0</span>/sec · <span id="per-click">1</span>/click</div>
      </div>

      <button id="face" class="face" aria-label="harvest epic points" title="harvest">
        <img src="assets/logo.png" alt="" draggable="false">
      </button>
      <div id="floaties" class="floaties"></div>

      <p id="status" class="status"></p>
    </section>

    <aside class="shop">
      <h2>// upgrades</h2>
      <div id="shop" class="shop-list"></div>
    </aside>
  </main>

  <script type="module" src="js/clicker.js"></script>
</body>
</html>
